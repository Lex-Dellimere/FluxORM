# flux_orm — an ORM for MeoSQL, as a library: no [bin] sections. `mbuild check`
# and `mbuild build` type-check src/flux_orm.mettle and everything it imports;
# `mbuild test` runs the tests' @test entries. The README shows how to build and
# run each test as a program in debug and release.
#
# No [toolchain] pin: flux_orm needs the dev compiler (compile-time reflection,
# `Kind`, comptime for). Select it with either:
#
#   export METTLE=/home/nox/Projects/mettle/Mettle/bin/mettle
#   mbuild --mettle /path/to/mettle check
[package]
name = "flux_orm"
version = "0.1.0"

[build]
targets = ["linux"]

[profile.release]
flags = ["--release"]
