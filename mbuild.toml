# flux_orm — an ORM for MeoSQL.
#
# No [toolchain] pin on purpose: flux_orm needs the head compiler (compile-time
# reflection, `Kind`, comptime for). Pin v0.17.0 and the build fails. Select
# head with either:
#
#   export METTLE=/home/nox/Projects/mettle/Mettle/bin/mettle
#   mbuild --mettle /path/to/mettle build
[package]
name = "flux_orm"
version = "0.1.0"

[build]
targets = ["linux"]

[profile.release]
flags = ["--release"]

# Each test file is also a program: `mbuild build [-r]` builds them all and
# `mbuild run t_query` runs one. Release matters: head miscompiles have shown
# up in release only. mbuild's library mode only sees .mettle files directly
# in src/, and flux_orm's live in src/<layer>/, so these bins are also what
# `mbuild check` type-checks.

[bin.t_adapter]
main = "tests/t_adapter.mettle"

[bin.t_changeset]
main = "tests/t_changeset.mettle"

[bin.t_integration]
main = "tests/t_integration.mettle"

[bin.t_meta]
main = "tests/t_meta.mettle"

[bin.t_migration]
main = "tests/t_migration.mettle"

[bin.t_persist]
main = "tests/t_persist.mettle"

[bin.t_query]
main = "tests/t_query.mettle"

[bin.t_relation]
main = "tests/t_relation.mettle"

[bin.t_repo]
main = "tests/t_repo.mettle"

[bin.t_session]
main = "tests/t_session.mettle"

[bin.t_value]
main = "tests/t_value.mettle"
